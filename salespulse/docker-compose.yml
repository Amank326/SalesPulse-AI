version: '3.8'
services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
